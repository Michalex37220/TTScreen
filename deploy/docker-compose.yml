# Essai local en conteneur (SQLite). Accessible uniquement depuis cette machine.
name: TTscreen
services:
  api:
    build: { context: .., dockerfile: deploy/Dockerfile }
    environment:
      TTSCREEN_ADMIN_TOKEN: ${TTSCREEN_ADMIN_TOKEN:?définir TTSCREEN_ADMIN_TOKEN (24 car. min., voir deploy/.env.example)}
    volumes:
      - data:/data
    ports:
      - "127.0.0.1:8000:8000" # a modifier si jamais vous voulez pouvoir y acceder sur le réseau local et non pas seulement la machine
    restart: no 
volumes:
  data:
