<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<tile>Lecteur TTscreen</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; cursor: none; }
  #stage { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
  #stage img, #stage video { width: 100%; height: 100%; object-fit: contain; }
  .text { color: #fff; font: 600 6vmin/1.25 system-ui, sans-serif; text-align: center;
          padding: 6vmin; white-space: pre-wrap; max-width: 90vw; }
  .msg { color: #888; font: 3vmin system-ui, sans-serif; text-align: center; padding: 4vmin; }
  #badge { position: fixed; left: 8px; bottom: 8px; font: 12px/1.4 monospace; color: #0f0;
           background: rgba(0,0,0,.65); padding: 4px 8px; border-radius: 4px; display: none; }
  #badge.on { display: block; }
</style>
</head>
<body>
<div id="stage"></div>
<div id="badge"></div>
<script src="player.js"></script>
</body>
</html>
